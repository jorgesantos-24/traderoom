# Many long-lived WebSockets behind one Caddy: deep accept queue, fast port reuse.
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 1000000
# Redis: avoid fork failures on BGSAVE under memory pressure.
vm.overcommit_memory = 1
