# Included from /etc/redis/redis.conf by vm-setup.sh. Redis is local only.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
# Prices (TTL 5 s), rate-limit counters (TTL) and orders:due (no TTL). Only keys with a TTL may be
# evicted, so the settlement queue is never dropped under memory pressure.
maxmemory 192mb
maxmemory-policy volatile-lru
# The queue is rebuilt from Postgres by the worker sweep, so periodic snapshots are enough.
save 300 1
appendonly no
